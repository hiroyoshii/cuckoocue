name: iOS TestFlight Upload

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  upload-testflight:
    name: Archive and Upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 45

    env:
      PROJECT: ios/CuckooCue.xcodeproj
      SCHEME: CuckooCue
      ARCHIVE_PATH: artifacts/CuckooCue.xcarchive
      EXPORT_PATH: artifacts/export
      DERIVED_DATA: build/ios-testflight-derived-data
      DESTINATION: generic/platform=iOS
      BUILD_NUMBER: ${{ github.run_number }}
      DEVELOPMENT_TEAM: 3M4M7DRUZY

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show tool versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen --version

      - name: Validate project metadata
        run: bash ios/Scripts/validate-project.sh

      - name: Install Firebase configuration
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [[ -z "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]]; then
            echo "Missing GOOGLE_SERVICE_INFO_PLIST_BASE64"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 -D > ios/CuckooCue/GoogleService-Info.plist
          plutil -lint ios/CuckooCue/GoogleService-Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' ios/CuckooCue/GoogleService-Info.plist)" = "app.cuckoocue.ios"

      - name: Install signing assets
        env:
          APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          CUCKOOCUE_APPSTORE_PROFILE_APP_BASE64: ${{ secrets.CUCKOOCUE_APPSTORE_PROFILE_APP_BASE64 }}
          CUCKOOCUE_APPSTORE_PROFILE_WIDGET_BASE64: ${{ secrets.CUCKOOCUE_APPSTORE_PROFILE_WIDGET_BASE64 }}
        run: bash ios/Scripts/install-signing-assets.sh

      - name: Inspect installed provisioning profiles
        run: bash ios/Scripts/inspect-provisioning-profiles.sh

      - name: Generate App Store Connect API key file
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          if [[ -z "$APP_STORE_CONNECT_API_KEY_P8" ]]; then
            echo "Missing APP_STORE_CONNECT_API_KEY_P8"
            exit 1
          fi
          if [[ -z "$APP_STORE_CONNECT_KEY_ID" ]]; then
            echo "Missing APP_STORE_CONNECT_KEY_ID"
            exit 1
          fi
          if [[ -z "$APP_STORE_CONNECT_ISSUER_ID" ]]; then
            echo "Missing APP_STORE_CONNECT_ISSUER_ID"
            exit 1
          fi
          api_key_path="$RUNNER_TEMP/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          mkdir -p "$(dirname "$api_key_path")" "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_P8" > "$api_key_path"
          chmod 600 "$api_key_path"
          cp "$api_key_path" "$HOME/.appstoreconnect/private_keys/"

      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml

      - name: Archive app
        run: |
          set -o pipefail
          mkdir -p artifacts
          echo "Archiving build number $BUILD_NUMBER"
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "$DESTINATION" \
            -archivePath "$ARCHIVE_PATH" \
            -derivedDataPath "$DERIVED_DATA" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            archive | tee artifacts/xcodebuild-archive.log

      - name: Verify archived build number
        run: |
          app_info="$ARCHIVE_PATH/Products/Applications/CuckooCue.app/Info.plist"
          widget_info="$ARCHIVE_PATH/Products/Applications/CuckooCue.app/PlugIns/CuckooCueWidget.appex/Info.plist"
          for info in "$app_info" "$widget_info"; do
            actual_build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$info")"
            echo "$info: CFBundleVersion=$actual_build"
            if [[ "$actual_build" != "$BUILD_NUMBER" ]]; then
              echo "Expected CFBundleVersion $BUILD_NUMBER, got $actual_build"
              exit 1
            fi
          done

      - name: Export ipa
        run: |
          set -o pipefail
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist ios/CuckooCueExportOptions.plist \
            | tee artifacts/xcodebuild-export.log
          find "$EXPORT_PATH" -maxdepth 2 -type f -print

      - name: Validate ipa with App Store Connect
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          ipa_path="$(find "$EXPORT_PATH" -name '*.ipa' -type f | head -n 1)"
          if [[ -z "$ipa_path" ]]; then
            echo "No .ipa found in $EXPORT_PATH"
            exit 1
          fi
          xcrun altool --validate-app \
            -f "$ipa_path" \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload ipa to TestFlight
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          ipa_path="$(find "$EXPORT_PATH" -name '*.ipa' -type f | head -n 1)"
          xcrun altool --upload-app \
            -f "$ipa_path" \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Cleanup signing assets
        if: always()
        run: bash ios/Scripts/cleanup-signing-assets.sh

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuckoo-cue-testflight-artifacts
          path: |
            artifacts/**/*.log
            artifacts/export/**/*.ipa
            artifacts/export/**/*.plist
            artifacts/provisioning-profile-summary.log
          if-no-files-found: ignore
          retention-days: 7
