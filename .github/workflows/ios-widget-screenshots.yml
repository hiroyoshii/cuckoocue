name: iOS E2E screenshots

on:
  workflow_dispatch:
  push:
    branches: [main, "codex/**"]
    paths:
      - "ios/**"
      - ".github/workflows/ios-widget-screenshots.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-widget-screenshots.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-screenshot:
    name: Build, Test, and Capture Screenshots
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Validate project metadata
        run: bash ios/Scripts/validate-project.sh

      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml

      - name: Create and boot simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          runtime="com.apple.CoreSimulator.SimRuntime.iOS-18-5"
          device_type="com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro"
          simulator_id="$(xcrun simctl create 'Cuckoo Cue CI' "$device_type" "$runtime")"
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b

      - name: Build app
        timeout-minutes: 15
        shell: bash
        run: |
          set +e
          mkdir -p build
          xcodebuild build \
            -project ios/CuckooCue.xcodeproj \
            -scheme CuckooCue \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -derivedDataPath build/ios-derived-data \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/CuckooCueBuild.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "xcodebuild failed with status $status"
            message="$(grep -E ' error: |: error:|BUILD FAILED|CompileSwift|Ld ' build/CuckooCueBuild.log | tail -30 || true)"
            if [ -z "$message" ]; then
              message="$(tail -80 build/CuckooCueBuild.log || true)"
            fi
            if [ -z "$message" ]; then
              message="No xcodebuild output was captured."
            fi
            message="${message//'%'/'%25'}"
            message="${message//$'\r'/'%0D'}"
            message="${message//$'\n'/'%0A'}"
            echo "::error title=Xcode build failed::$message"
            exit "$status"
          fi

      - name: Run app and model tests
        timeout-minutes: 15
        shell: bash
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/CuckooCue.xcodeproj \
            -scheme CuckooCue \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -derivedDataPath build/ios-derived-data \
            -resultBundlePath build/CuckooCueTests.xcresult \
            -only-testing:CuckooCueTests \
            -only-testing:CuckooCueUITests \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/CuckooCueTests.log

      - name: Capture widget previews
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          simulator_id='${{ steps.simulator.outputs.id }}'
          app_path="build/ios-derived-data/Build/Products/Debug-iphonesimulator/CuckooCue.app"
          mkdir -p build/ios-widget-screenshots/widget-states build/ios-widget-screenshots/app
          xcrun simctl install "$simulator_id" "$app_path"

          capture() {
            local output="$1"
            shift
            xcrun simctl terminate "$simulator_id" app.cuckoocue.ios 2>/dev/null || true
            xcrun simctl launch "$simulator_id" app.cuckoocue.ios --ui-testing "$@"
            sleep 2
            xcrun simctl io "$simulator_id" screenshot "build/ios-widget-screenshots/$output.png"
          }

          capture widget-small --screenshot-gallery small
          capture widget-medium --screenshot-gallery medium
          capture widget-large --screenshot-gallery large
          capture widget-lock-screen --screenshot-gallery lock
          capture widget-states/widget-dark-medium --screenshot-gallery medium state-dark
          capture widget-states/widget-large-text-medium --screenshot-gallery medium state-large-text
          capture widget-states/widget-empty-medium --screenshot-gallery medium state-empty
          capture widget-states/widget-priority-empty-medium --screenshot-gallery medium state-priority-empty
          capture widget-states/widget-include-quiet-medium --screenshot-gallery medium state-priority-empty state-include-quiet
          capture widget-states/widget-undo-small --screenshot-gallery small state-undo
          capture widget-states/widget-undo-medium --screenshot-gallery medium state-undo
          capture widget-states/widget-scoped-run-medium --screenshot-gallery medium state-scoped-run
          capture widget-states/widget-paged-medium --screenshot-gallery medium state-paged
          capture widget-states/widget-many-runs-medium --screenshot-gallery medium state-many-runs
          capture widget-states/widget-many-runs-large --screenshot-gallery large state-many-runs
          capture app/app-list
          capture app/app-empty-list state-empty
          capture app/app-completed-list state-completed-run
          capture app/app-detail --screenshot-detail
          capture app/app-completed-detail --screenshot-detail state-completed-run
          capture app/app-many-runs-list state-many-runs
          capture app/app-many-runs-detail --screenshot-detail state-many-runs
          capture app/app-widget-settings --screenshot-settings
          capture app/app-new-run --screenshot-new-run
          capture app/app-new-task --screenshot-new-task
          capture app/app-edit-task --screenshot-edit-task

      - name: Capture actual Home Screen widget
        id: home-screen
        continue-on-error: true
        timeout-minutes: 15
        shell: bash
        run: |
          set -o pipefail
          simulator_id='${{ steps.simulator.outputs.id }}'
          xcodebuild test \
            -project ios/CuckooCue.xcodeproj \
            -scheme CuckooCueHomeScreenUITests \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -derivedDataPath build/ios-home-derived-data \
            -resultBundlePath build/CuckooCueHomeScreenTests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) SCREENSHOT_TESTING' \
            | tee build/CuckooCueHomeScreenTests.log
          sleep 8
          xcrun simctl uninstall "$simulator_id" app.cuckoocue.ios.uitests.xctrunner 2>/dev/null || true
          xcrun simctl uninstall "$simulator_id" app.cuckoocue.ios.homescreen-uitests.xctrunner 2>/dev/null || true
          xcrun simctl io "$simulator_id" screenshot \
            build/ios-widget-screenshots/widget-states/widget-actual-home-screen.png

      - name: Require actual Home Screen screenshot
        if: steps.home-screen.outcome == 'failure'
        run: exit 1

      - name: Upload E2E screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuckoo-cue-ios-e2e-screenshots
          path: |
            build/ios-widget-screenshots/**/*.png
            build/ios-widget-screenshots/*.png
            build/*.log
            build/*.xcresult/**
          if-no-files-found: warn
          retention-days: 14
