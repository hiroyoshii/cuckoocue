name: Android widget screenshots

on:
  workflow_dispatch:
  push:
    branches: [main, "codex/**"]
    paths:
      - "android/**"
      - ".github/workflows/android-widget-screenshots.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-widget-screenshots.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run widget verification and capture screenshots
        timeout-minutes: 45
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            bash ./android/scripts/ci-widget-screenshots.sh

      - name: Upload widget screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuckoo-cue-android-widget-screenshots
          path: |
            build/android-widget-screenshots/**/*.png
            build/android-widget-screenshots/*.png
            build/android-widget-screenshots/verification.log
            android/app/build/reports/androidTests/**
          if-no-files-found: warn
          retention-days: 14
