name: CuckooCue
options:
  bundleIdPrefix: app.cuckoocue
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  CuckooCue:
    type: application
    platform: iOS
    sources:
      - path: CuckooCue
      - path: Shared
      - path: WidgetShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cuckoocue.ios
        PRODUCT_NAME: CuckooCue
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: CuckooCue/Info.plist
      properties:
        CFBundleDisplayName: Cuckoo Cue
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    entitlements:
      path: CuckooCue/CuckooCue.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.cuckoocue.shared
    dependencies:
      - target: CuckooCueWidgetExtension
        embed: true
    scheme:
      testTargets:
        - CuckooCueTests
        - CuckooCueUITests
  CuckooCueWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: CuckooCueWidget
      - path: Shared
      - path: WidgetShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cuckoocue.ios.widget
        PRODUCT_NAME: CuckooCueWidget
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: CuckooCueWidget/Info.plist
      properties:
        CFBundleDisplayName: Cuckoo Cue
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: CuckooCueWidget/CuckooCueWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.cuckoocue.shared
  CuckooCueTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CuckooCueTests]
    dependencies:
      - target: CuckooCue
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cuckoocue.ios.tests
  CuckooCueUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CuckooCueUITests]
    dependencies:
      - target: CuckooCue
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cuckoocue.ios.uitests

