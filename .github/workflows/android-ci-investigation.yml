name: Inspect Android CI evidence
on:
  push:
    branches: [main]
    paths: [".github/workflows/android-ci-investigation.yml"]
permissions:
  actions: read
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover failed run evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=34739148376
          gh run download "$run_id" --name cuckoo-cue-android-widget-screenshots --dir build/recovered-ci
          evidence="docs/review-screenshots/android/failures/$run_id"
          mkdir -p "$evidence"
          find build/recovered-ci -type f \( -name 'verification.log' -o -name 'verification-failure*' \) -exec cp {} "$evidence/" \;
          tail -30 "$evidence/verification.log"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$evidence"
          if ! git diff --cached --quiet; then
            git commit -m "Recover original Android CI failure evidence"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
